name: Build Luanti for Raspberry Pi 5 (Fixed)

on:
  push:
    branches: [ "main", "master", "stable-5" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build-rpi5:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    
    - name: Install ARM64 cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          ninja-build \
          cmake \
          pkg-config \
          git
    
    - name: Configure multiarch sources
      run: |
        # Резервное копирование оригинального sources.list
        sudo cp /etc/apt/sources.list /etc/apt/sources.list.backup
        
        # Настройка архитектурно-специфичных источников
        sudo bash -c 'cat > /etc/apt/sources.list << EOF
# AMD64 архитектура - основные репозитории Ubuntu
deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse
deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse
deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble-backports main restricted universe multiverse
deb [arch=amd64] http://security.ubuntu.com/ubuntu/ noble-security main restricte

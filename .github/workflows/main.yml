name: Build Luanti for Raspberry Pi 5

on:
  push:
    branches: [ "main", "master", "stable-5" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build-rpi5:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    
    - name: Install ARM64 cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          ninja-build \
          cmake \
          pkg-config \
          git
    
    - name: Install ARM64 dependencies
      run: |
        # Настройка dpkg для мультиархитектуры
        sudo dpkg --add-architecture arm64
        sudo apt-get update
        
        # Установка ARM64 библиотек
        sudo apt-get install -y \
          libsqlite3-dev:arm64 \
          libcurl4-openssl-dev:arm64 \
          zlib1g-dev:arm64 \
          libgmp-dev:arm64 \
          libjsoncpp-dev:arm64 \
          libzstd-dev:arm64 \
          libncurses-dev:arm64 \
          libpng-dev:arm64 \
          libjpeg-dev:arm64 \
          libfreetype6-dev:arm64 \
          libogg-dev:arm64 \
          libvorbis-dev:arm64 \
          libopenal-dev:arm64 \
          libgl1-mesa-dev:arm64 \
          libgles2-mesa-dev:arm64 \
          libegl1-mesa-dev:arm64
    
    - name: Build LuaJIT for ARM64
      run: |
        git clone https://github.com/LuaJIT/LuaJIT.git luajit
        cd luajit
        make HOST_CC="gcc -m64" CROSS=aarch64-linux-gnu- TARGET_SYS=Linux amalg -j$(nproc)
     
